</div>
</div>
<div class="flex items-center gap-1">
<button aria-label="Toggle Font Size" class="w-[48px] h-[48px] flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high rounded-full transition-transform duration-100 active:scale-95 font-bold text-lg">
A<span class="text-sm">±</span>

<button aria-label="Toggle Theme" class="w-[48px] h-[48px] flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high rounded-full transition-transform duration-100 active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dark_mode</span>
</button>
<button aria-label="Change Language" class="w-[48px] h-[48px] flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high rounded-full transition-transform duration-100 active:scale-95">

</button>

</div>
<!-- Modern Vertical/Staggered Layout -->
<section class="flex flex-col gap-4 w-full">
<!-- Daily Routine -->
<button aria-label="Daily Routine" class="flex items-center gap-4 bg-primary-fixed border border-outline-variant rounded-2xl p-4 active:scale-95 transition-transform duration-100 shadow-sm text-left">

<span class="material-symbols-outlined text-3xl text-on-primary" style="font-variation-settings: 'FILL' 1;">checklist</span>
</div>
<div class="flex-grow">
<span class="font-label-xl text-on-primary-fixed font-bold block mb-1 flex items-center gap-2">Daily Routine <span class="material-symbols-outlined text-[18px] text-surface-tint">volume_up</span></span>
<span class="font-body-md text-on-surface-variant">3 tasks remaining</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>

</div>
<div class="flex-grow">
<span class="font-label-xl text-[#e65100] font-bold block mb-1 flex items-center gap-2">Pill Reminders <span class="material-symbols-outlined text-[18px] text-surface-tint">volume_up</span></span>
<span class="font-body-md text-on-surface-variant">Next: 2:00 PM</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>

<span class="material-symbols-outlined text-3xl text-white" style="font-variation-settings: 'FILL' 1;">psychology</span>
</div>
<div class="flex-grow">
<span class="font-label-xl text-[#4a148c] font-bold block mb-1 flex items-center gap-2">Brain Games <span class="material-symbols-outlined text-[18px] text-surface-tint">volume_up</span></span>
<span class="font-body-md text-on-surface-variant">Daily puzzle ready</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>

<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-xl text-sm font-bold">Home</span>
