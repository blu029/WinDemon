<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Daily Routine Tracker</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                extend: {

                        "surface-bright": "#f9f9f9",

                        "surface-variant": "#e2e2e2",
                        "surface-container-high": "#e8e8e8",
                        "tertiary-container": "#600007",
                        "surface": "#f9f9f9",
                        "error": "#ba1a1a",
                        "inverse-primary": "#aac7ff",
                        "on-primary-fixed": "#001b3e",
                        "surface-dim": "#dadada",
                        "on-secondary-fixed": "#221b00",
                        "inverse-on-surface": "#f1f1f1",
                        "secondary": "#705d00",
                        "on-primary-container": "#7594cb",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#930010",
                        "on-background": "#1b1b1b",

                        "tertiary": "#390002",
                        "tertiary-fixed": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f3f3f3",

                        "surface-tint": "#3f5f92",
                        "outline-variant": "#c4c6d0",
                        "on-secondary-container": "#6e5c00",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#ff5a53",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "background": "#f9f9f9",
                        "primary": "#001736",
                        "secondary-container": "#fcd400",
                        "inverse-surface": "#303030",
                        "surface-container": "#eeeeee",
                        "secondary-fixed-dim": "#e9c400",
                        "tertiary-fixed-dim": "#ffb3ac"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "48px",
                        "margin-page": "20px",
                        "grid-gap": "16px",
                        "gutter": "16px",
                        "stack-gap": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "label-xl": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "button-text": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["34px", { "lineHeight": "42px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-xl": ["20px", { "lineHeight": "24px", "fontWeight": "700" }],
                        "body-md": ["18px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "800" }],
                        "headline-md": ["24px", { "lineHeight": "30px", "fontWeight": "700" }],
                        "button-text": ["22px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "body-lg": ["20px", { "lineHeight": "28px", "fontWeight": "500" }]
                    }
                }
            }
        }

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface dark:bg-surface-dim text-on-surface w-full h-full pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-page h-[64px] bg-surface dark:bg-surface-dim border-b-2 border-outline-variant dark:border-outline">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-highest active:scale-95 transition-transform duration-100 p-2 rounded-full min-h-touch-target-min min-w-touch-target-min flex items-center justify-center">
<span class="material-symbols-outlined text-3xl">menu</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary dark:text-primary-fixed-dim">WinDemon</h1>
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-highest active:scale-95 transition-transform duration-100 p-2 rounded-full min-h-touch-target-min min-w-touch-target-min flex items-center justify-center font-bold">
            5 🔥
        </button>
</header>
<main class="pt-[88px] px-margin-page max-w-4xl mx-auto space-y-stack-gap">
<!-- Streak Card -->
<div class="bg-secondary-container dark:bg-secondary rounded-xl p-6 flex items-center gap-4 shadow-sm border-2 border-transparent">
<div class="bg-surface p-3 rounded-full text-secondary-container">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
<div>
<h2 class="font-label-xl text-label-xl text-on-secondary-container dark:text-on-secondary">5 Day Consecutive Streak</h2>
<p class="font-body-md text-body-md text-on-secondary-container dark:text-on-secondary opacity-90">Keep it up! You're doing great.</p>
</div>
</div>
<!-- Progress Header -->
<div class="flex flex-col gap-4">
<h2 class="font-headline-lg text-headline-lg-mobile text-primary dark:text-primary-fixed-dim">Today's Progress: 80% Completed</h2>
<div class="w-full bg-surface-container-highest dark:bg-outline-variant h-4 rounded-full overflow-hidden">
<div class="bg-primary dark:bg-primary-fixed h-full rounded-full w-[80%] transition-all duration-500"></div>
</div>
</div>
<!-- Task List -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-grid-gap">
<label class="flex items-center gap-4 bg-surface-container-lowest dark:bg-surface-variant p-6 rounded-xl border-2 border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors min-h-[96px]">
<input checked="" class="w-10 h-10 rounded border-2 border-outline text-primary focus:ring-primary-container bg-surface-bright" type="checkbox"/>
<div class="flex items-center gap-3 flex-1">
<span class="material-symbols-outlined text-3xl text-primary">directions_walk</span>
<span class="font-button-text text-button-text line-through opacity-70">Morning Walk</span>
</div>
</label>
<label class="flex items-center gap-4 bg-surface-container-lowest dark:bg-surface-variant p-6 rounded-xl border-2 border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors min-h-[96px]">
<input checked="" class="w-10 h-10 rounded border-2 border-outline text-primary focus:ring-primary-container bg-surface-bright" type="checkbox"/>
<div class="flex items-center gap-3 flex-1">
<span class="material-symbols-outlined text-3xl text-primary">medication</span>
<span class="font-button-text text-button-text line-through opacity-70">Take Pills</span>
</div>
</label>
<label class="flex items-center gap-4 bg-surface-container-lowest dark:bg-surface-variant p-6 rounded-xl border-2 border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors min-h-[96px]">
<input checked="" class="w-10 h-10 rounded border-2 border-outline text-primary focus:ring-primary-container bg-surface-bright" type="checkbox"/>
<div class="flex items-center gap-3 flex-1">
<span class="material-symbols-outlined text-3xl text-primary">water_drop</span>
<span class="font-button-text text-button-text line-through opacity-70">Water</span>
</div>
</label>
<label class="flex items-center gap-4 bg-surface-container-lowest dark:bg-surface-variant p-6 rounded-xl border-2 border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors min-h-[96px]">
<input checked="" class="w-10 h-10 rounded border-2 border-outline text-primary focus:ring-primary-container bg-surface-bright" type="checkbox"/>
<div class="flex items-center gap-3 flex-1">
<span class="material-symbols-outlined text-3xl text-primary">restaurant</span>
<span class="font-button-text text-button-text line-through opacity-70">Lunch</span>
</div>
</label>
<label class="flex items-center gap-4 bg-surface-bright dark:bg-surface p-6 rounded-xl border-2 border-primary cursor-pointer hover:bg-surface-container-low transition-colors min-h-[96px]">
<input class="w-10 h-10 rounded border-2 border-outline text-primary focus:ring-primary-container bg-surface-bright" type="checkbox"/>
<div class="flex items-center gap-3 flex-1">
<span class="material-symbols-outlined text-3xl text-primary">accessibility_new</span>
<span class="font-button-text text-button-text">Posture</span>
</div>
</label>
</div>
<!-- Action Button -->
<div class="pt-8 pb-4">
<button class="w-full bg-primary text-on-primary dark:bg-primary-fixed dark:text-on-primary-fixed font-button-text text-button-text min-h-[64px] rounded-xl flex items-center justify-center gap-3 hover:opacity-90 active:scale-[0.98] transition-all border-2 border-transparent focus:border-secondary-container">
<span>Go to End-of-Day Recall</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 pb-4 pt-2 bg-surface dark:bg-surface-dim border-t-2 border-outline-variant dark:border-outline md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-4 py-2 hover:bg-surface-container dark:hover:bg-surface-container-high active:translate-y-1 transition-all duration-200 rounded-xl min-h-touch-target-min min-w-touch-target-min">
<span class="material-symbols-outlined text-2xl mb-1">home</span>
<span class="font-label-xl text-sm">Home</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-xl px-6 py-2 hover:bg-surface-container dark:hover:bg-surface-container-high active:translate-y-1 transition-all duration-200 min-h-touch-target-min min-w-touch-target-min">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">checklist</span>
<span class="font-label-xl text-sm font-bold">Tasks</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-4 py-2 hover:bg-surface-container dark:hover:bg-surface-container-high active:translate-y-1 transition-all duration-200 rounded-xl min-h-touch-target-min min-w-touch-target-min">
<span class="material-symbols-outlined text-2xl mb-1">volunteer_activism</span>
<span class="font-label-xl text-sm">Care</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-4 py-2 hover:bg-surface-container dark:hover:bg-surface-container-high active:translate-y-1 transition-all duration-200 rounded-xl min-h-touch-target-min min-w-touch-target-min">
<span class="material-symbols-outlined text-2xl mb-1">settings</span>
<span class="font-label-xl text-sm">Settings</span>
</button>
</nav>
</body></html>
