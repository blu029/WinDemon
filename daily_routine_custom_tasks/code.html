<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>

<body class="bg-surface dark:bg-surface-dim text-on-surface w-full h-full pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-page h-[64px] bg-surface dark:bg-surface-dim border-b-2 border-outline-variant dark:border-outline">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-highest active:scale-95 transition-transform duration-100 p-2 rounded-full min-h-touch-target-min min-w-touch-target-min flex items-center justify-center">
<span class="material-symbols-outlined text-3xl">menu</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary dark:text-primary-fixed-dim">WinDemon</h1>
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-highest active:scale-95 transition-transform duration-100 p-2 rounded-full min-h-touch-target-min min-w-touch-target-min flex items-center justify-center font-bold">
            5 🔥
        </button>
</header>
<main class="pt-[88px] px-margin-page max-w-4xl mx-auto space-y-stack-gap">
<!-- Streak Card -->
<div class="bg-secondary-container dark:bg-secondary rounded-xl p-6 flex items-center gap-4 shadow-sm border-2 border-transparent">
<div class="bg-surface p-3 rounded-full text-secondary-container">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
<div>
<h2 class="font-label-xl text-label-xl text-on-secondary-container dark:text-on-secondary">5 Day Consecutive Streak</h2>
<p class="font-body-md text-body-md text-on-secondary-container dark:text-on-secondary opacity-90">Keep it up! You're doing great.</p>
</div>
</div>
<!-- Sophisticated Progress Visualization -->
<div class="flex items-center gap-6 bg-surface-container dark:bg-surface-variant p-6 rounded-2xl shadow-sm border border-outline-variant dark:border-outline">
<!-- Circular Progress -->
<div class="relative w-24 h-24 flex-shrink-0">
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 100 100">
<circle class="text-surface-container-highest dark:text-outline-variant" cx="50" cy="50" fill="transparent" r="40" stroke="currentColor" stroke-width="8"></circle>
<circle class="text-primary dark:text-primary-fixed" cx="50" cy="50" fill="transparent" r="40" stroke="currentColor" stroke-dasharray="251.2" stroke-dashoffset="50.24" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="font-headline-md text-primary dark:text-primary-fixed-dim">80%</span>
</div>
</div>
<div>
<h2 class="font-headline-md text-on-surface dark:text-on-surface">Today's Progress</h2>
<p class="font-body-md text-on-surface-variant dark:text-inverse-on-surface mt-1">4 of 5 tasks completed</p>
</div>
</div>
<!-- Task List -->
<div class="flex flex-col gap-4">
<!-- Completed Task 1 -->
<div class="relative flex items-center bg-surface-container-low dark:bg-surface-variant p-4 rounded-xl border-2 border-primary overflow-hidden">
<div class="absolute inset-0 bg-primary/10"></div>
<div class="flex items-center gap-3 flex-1 relative z-10 opacity-70">
<button aria-label="Read task aloud" class="text-primary dark:text-primary-fixed p-2 rounded-full flex items-center justify-center min-w-[48px] min-h-[48px] hover:bg-surface-container-highest active:scale-95 transition-transform">
<span class="material-symbols-outlined text-2xl">volume_up</span>
</button>
<span class="font-button-text text-button-text flex-1 line-through">Morning Walk</span>
</div>
<div class="relative z-10 w-14 h-14 bg-primary dark:bg-primary-fixed rounded-full flex items-center justify-center shadow-sm text-on-primary dark:text-on-primary-fixed">
<span class="material-symbols-outlined text-2xl">check</span>
</div>
</div>
<!-- Completed Task 2 -->
<div class="relative flex items-center bg-surface-container-low dark:bg-surface-variant p-4 rounded-xl border-2 border-primary overflow-hidden">
<div class="absolute inset-0 bg-primary/10"></div>
<div class="flex items-center gap-3 flex-1 relative z-10 opacity-70">
<button aria-label="Read task aloud" class="text-primary dark:text-primary-fixed p-2 rounded-full flex items-center justify-center min-w-[48px] min-h-[48px] hover:bg-surface-container-highest active:scale-95 transition-transform">
<span class="material-symbols-outlined text-2xl">volume_up</span>
</button>
<span class="font-button-text text-button-text flex-1 line-through">Take Pills</span>
</div>
<div class="relative z-10 w-14 h-14 bg-primary dark:bg-primary-fixed rounded-full flex items-center justify-center shadow-sm text-on-primary dark:text-on-primary-fixed">
<span class="material-symbols-outlined text-2xl">check</span>
</div>
</div>
<!-- Completed Task 3 -->
<div class="relative flex items-center bg-surface-container-low dark:bg-surface-variant p-4 rounded-xl border-2 border-primary overflow-hidden">
<div class="absolute inset-0 bg-primary/10"></div>
<div class="flex items-center gap-3 flex-1 relative z-10 opacity-70">
<button aria-label="Read task aloud" class="text-primary dark:text-primary-fixed p-2 rounded-full flex items-center justify-center min-w-[48px] min-h-[48px] hover:bg-surface-container-highest active:scale-95 transition-transform">
<span class="material-symbols-outlined text-2xl">volume_up</span>
</button>
<span class="font-button-text text-button-text flex-1 line-through">Water</span>
</div>
<div class="relative z-10 w-14 h-14 bg-primary dark:bg-primary-fixed rounded-full flex items-center justify-center shadow-sm text-on-primary dark:text-on-primary-fixed">
<span class="material-symbols-outlined text-2xl">check</span>
</div>
</div>
<!-- Completed Task 4 -->
<div class="relative flex items-center bg-surface-container-low dark:bg-surface-variant p-4 rounded-xl border-2 border-primary overflow-hidden">
<div class="absolute inset-0 bg-primary/10"></div>
<div class="flex items-center gap-3 flex-1 relative z-10 opacity-70">
<button aria-label="Read task aloud" class="text-primary dark:text-primary-fixed p-2 rounded-full flex items-center justify-center min-w-[48px] min-h-[48px] hover:bg-surface-container-highest active:scale-95 transition-transform">
<span class="material-symbols-outlined text-2xl">volume_up</span>
</button>
<span class="font-button-text text-button-text flex-1 line-through">Lunch</span>
</div>
<div class="relative z-10 w-14 h-14 bg-primary dark:bg-primary-fixed rounded-full flex items-center justify-center shadow-sm text-on-primary dark:text-on-primary-fixed">
<span class="material-symbols-outlined text-2xl">check</span>
</div>
</div>
<!-- Incomplete Task (Swipe/Tap to verify) -->
<div class="relative flex items-center bg-surface-container-lowest dark:bg-surface p-4 rounded-xl border-2 border-outline-variant dark:border-outline overflow-hidden group hover:border-primary transition-colors">
<div class="absolute inset-0 bg-primary/5 flex items-center px-4 w-0 group-hover:w-full transition-all duration-300"></div>
<div class="flex items-center gap-3 flex-1 relative z-10">
<button aria-label="Read task aloud" class="text-on-surface-variant dark:text-outline hover:text-primary dark:hover:text-primary-fixed p-2 rounded-full flex items-center justify-center min-w-[48px] min-h-[48px] transition-colors">
<span class="material-symbols-outlined text-2xl">volume_up</span>
</button>
<span class="font-button-text text-button-text flex-1">Posture</span>
</div>
<div class="relative z-10 w-14 h-14 bg-surface-container-high dark:bg-surface-variant rounded-full flex items-center justify-center shadow-sm cursor-pointer active:scale-95 border-2 border-outline-variant dark:border-outline text-on-surface-variant dark:text-outline hover:bg-surface-container-highest transition-all group-hover:border-primary group-hover:text-primary">
<span class="material-symbols-outlined text-3xl">swipe_right</span>
</div>
</div>
</div>
<!-- Add Custom Task -->
<div class="mt-8 flex items-center gap-3">
<input class="flex-1 bg-surface-container-lowest dark:bg-surface-variant border-2 border-outline-variant dark:border-outline rounded-xl px-5 min-h-[64px] font-body-lg text-on-surface placeholder:text-outline-variant focus:border-primary focus:ring-0 outline-none transition-colors" placeholder="Add Custom Task..." type="text"/>
<button class="bg-primary text-on-primary dark:bg-primary-fixed dark:text-on-primary-fixed rounded-xl min-w-[64px] min-h-[64px] flex items-center justify-center shadow-sm hover:opacity-90 active:scale-95 transition-all">
<span class="material-symbols-outlined text-3xl">add</span>
</button>
</div>
<!-- Action Button -->
<div class="pt-8 pb-4">
<button class="w-full bg-primary text-on-primary dark:bg-primary-fixed dark:text-on-primary-fixed font-button-text text-button-text min-h-[64px] rounded-xl flex items-center justify-center gap-3 hover:opacity-90 active:scale-[0.98] transition-all border-2 border-transparent focus:border-secondary-container shadow-md">
<span>Go to End-of-Day Recall</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>

<span class="material-symbols-outlined text-2xl mb-1">home</span>
<span class="font-label-xl text-sm">Home</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-xl px-6 py-2 hover:bg-surface-container dark:hover:bg-surface-container-high active:translate-y-1 transition-all duration-200 min-h-touch-target-min min-w-touch-target-min">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">checklist</span>
<span class="font-label-xl text-sm font-bold">Tasks</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-4 py-2 hover:bg-surface-container dark:hover:bg-surface-container-high active:translate-y-1 transition-all duration-200 rounded-xl min-h-touch-target-min min-w-touch-target-min">
<span class="material-symbols-outlined text-2xl mb-1">volunteer_activism</span>
<span class="font-label-xl text-sm">Care</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-4 py-2 hover:bg-surface-container dark:hover:bg-surface-container-high active:translate-y-1 transition-all duration-200 rounded-xl min-h-touch-target-min min-w-touch-target-min">
<span class="material-symbols-outlined text-2xl mb-1">settings</span>
<span class="font-label-xl text-sm">Settings</span>
</button>
</nav>
